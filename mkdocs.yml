site_name: DwellerMC Admin Wiki
site_url: https://craftyplayz.github.io/DwellerMC-admin-wiki/
repo_url: https://github.com/Craftyplayz/DwellerMC-admin-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle: { icon: material/brightness-4, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

nav:
  - Home: index.md
  - Install & fresh world: install.md
  - Config reference:
      - DwellerCore: config-core.md
      - DwellerBiomes: config-biomes.md
      - DwellerStructures: config-structures.md
  - Plugins:
      - Permissions & safety:
          - LuckPerms: plugins/luckperms.md
          - CoreProtect: plugins/coreprotect.md
          - WorldGuard: plugins/worldguard.md
          - WorldEdit: plugins/worldedit.md
          - InvSee++: plugins/invseeplusplus.md
          - spark: plugins/spark.md
      - EssentialsX:
          - Overview: plugins/essentials.md
          - Commands and permissions: plugins/essentials-commands.md
          - Config reference: plugins/essentials-config.md
      - Mining:
          - Veinminer: plugins/veinminer.md
          - CraftyTools: plugins/craftytools.md
          - PickupBot: plugins/pickupbot.md
      - Gameplay & building:
          - BreweryX: plugins/breweryx.md
          - Vaults: plugins/vaults.md
          - V-Elevator: plugins/v-elevator.md
          - Vertical slabs: plugins/vertical-slabs.md
          - HeadDatabase: plugins/headdatabase.md
          - NameColor: plugins/namecolor.md
      - Community:
          - DiscordSRV: plugins/discordsrv.md
          - TAB: plugins/tab.md
          - Plan: plugins/plan.md
          - BlockReports: plugins/blockreports.md
          - Citizens: plugins/citizens.md
          - Disguises: plugins/disguises.md
  - Technical notes: technical.md
  - Troubleshooting: troubleshooting.md
